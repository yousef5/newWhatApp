appId: com.multiwhatsapp.app
productName: MultiWhatsApp
copyright: Copyright © 2026 MultiWhatsApp

directories:
  output: release
  buildResources: resources

asar: true
npmRebuild: false
buildDependenciesFromSource: false

# Only include the vite-built output — no node_modules needed
files:
  - out/**/*
  - package.json

# Workaround: create a dummy node_modules so electron-builder doesn't complain
beforeBuild: |
  mkdir -p node_modules

extraResources:
  - from: resources/icon.png
    to: icon.png

# Linux
linux:
  target:
    - target: AppImage
      arch: [x64]
  icon: resources/icon.png
  category: Network

# Windows
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: resources/icon.ico

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: MultiWhatsApp

# macOS
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  icon: resources/icon.png
  category: public.app-category.social-networking
  darkModeSupport: true

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
