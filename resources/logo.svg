<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="w-fill" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#e9d5ff"/>
      <stop offset="40%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="dot1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="dot2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="dot3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="w-glow">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#a855f7" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="250" fill="#050508"/>
  <circle cx="256" cy="256" r="250" fill="none" stroke="url(#ring)" stroke-width="4"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="#1a1025" stroke-width="1"/>

  <!-- W letter — stylized, modern, thick strokes -->
  <g filter="w-glow" transform="translate(256,240)">
    <!-- The W shape — built from 4 diagonal strokes meeting at 3 valley points -->
    <path
      d="
        M-140,-100
        L-80, 100
        L-20,-40
        L20, 60
        L80,-100
      "
      fill="none"
      stroke="url(#w-fill)"
      stroke-width="32"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Accent dots at the valley/peak points -->
    <circle cx="-80" cy="100" r="6" fill="#e9d5ff"/>
    <circle cx="-20" cy="-40" r="6" fill="#c084fc"/>
    <circle cx="20" cy="60" r="6" fill="#a855f7"/>
  </g>

  <!-- Chat bubble indicators — small, elegant -->
  <!-- Bubble 1: top-right -->
  <g transform="translate(370, 100)">
    <rect width="56" height="32" rx="16" fill="url(#dot1)" opacity="0.9"/>
    <rect x="10" y="10" width="20" height="4" rx="2" fill="#fff" opacity="0.6"/>
    <rect x="10" y="18" width="32" height="4" rx="2" fill="#fff" opacity="0.4"/>
    <!-- Tail -->
    <polygon points="44,32 56,32 48,42" fill="url(#dot1)" opacity="0.9"/>
  </g>

  <!-- Bubble 2: bottom-left -->
  <g transform="translate(86, 340)">
    <rect width="56" height="32" rx="16" fill="url(#dot2)" opacity="0.9"/>
    <rect x="10" y="10" width="24" height="4" rx="2" fill="#fff" opacity="0.6"/>
    <rect x="10" y="18" width="36" height="4" rx="2" fill="#fff" opacity="0.4"/>
    <!-- Tail -->
    <polygon points="0,32 12,32 4,42" fill="url(#dot2)" opacity="0.9"/>
  </g>

  <!-- Multi-account dots at bottom -->
  <g filter="glow" transform="translate(256, 430)">
    <circle cx="-40" cy="0" r="12" fill="url(#dot1)"/>
    <circle cx="0" cy="0" r="12" fill="url(#dot2)"/>
    <circle cx="40" cy="0" r="12" fill="url(#dot3)"/>
    <!-- Connecting line -->
    <line x1="-28" y1="0" x2="28" y2="0" stroke="#2a2a3a" stroke-width="2"/>
  </g>
</svg>
