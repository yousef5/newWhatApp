<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="bubble1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="bubble2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="glow-filter">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#a855f7" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Outer circle background -->
  <circle cx="256" cy="256" r="248" fill="#050505"/>
  <circle cx="256" cy="256" r="248" fill="none" stroke="url(#glow)" stroke-width="4" opacity="0.6"/>

  <!-- Subtle ring -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#1a1a2e" stroke-width="1"/>

  <!-- WhatsApp phone icon (stylized) -->
  <g filter="shadow" transform="translate(126, 116)">
    <!-- Phone body outline -->
    <rect x="20" y="0" width="220" height="280" rx="40" fill="#111" stroke="url(#glow)" stroke-width="3"/>

    <!-- Screen area -->
    <rect x="36" y="20" width="188" height="220" rx="8" fill="#0a0a0a"/>

    <!-- Chat lines on screen -->
    <!-- Message 1 - incoming -->
    <g transform="translate(48, 36)">
      <rect width="100" height="28" rx="14" fill="url(#bubble1)" opacity="0.9"/>
      <rect x="12" y="8" width="40" height="4" rx="2" fill="#fff" opacity="0.7"/>
      <rect x="12" y="16" width="60" height="4" rx="2" fill="#fff" opacity="0.5"/>
    </g>

    <!-- Message 2 - outgoing -->
    <g transform="translate(102, 76)">
      <rect width="110" height="28" rx="14" fill="url(#bubble2)" opacity="0.9"/>
      <rect x="12" y="8" width="50" height="4" rx="2" fill="#fff" opacity="0.7"/>
      <rect x="12" y="16" width="70" height="4" rx="2" fill="#fff" opacity="0.5"/>
    </g>

    <!-- Message 3 - incoming -->
    <g transform="translate(48, 116)">
      <rect width="80" height="28" rx="14" fill="url(#bubble1)" opacity="0.9"/>
      <rect x="12" y="8" width="30" height="4" rx="2" fill="#fff" opacity="0.7"/>
      <rect x="12" y="16" width="45" height="4" rx="2" fill="#fff" opacity="0.5"/>
    </g>

    <!-- Message 4 - outgoing -->
    <g transform="translate(82, 156)">
      <rect width="130" height="28" rx="14" fill="url(#bubble2)" opacity="0.9"/>
      <rect x="12" y="8" width="65" height="4" rx="2" fill="#fff" opacity="0.7"/>
      <rect x="12" y="16" width="90" height="4" rx="2" fill="#fff" opacity="0.5"/>
    </g>

    <!-- Message 5 - incoming -->
    <g transform="translate(48, 196)">
      <rect width="90" height="28" rx="14" fill="url(#bubble1)" opacity="0.9"/>
      <rect x="12" y="8" width="35" height="4" rx="2" fill="#fff" opacity="0.7"/>
      <rect x="12" y="16" width="55" height="4" rx="2" fill="#fff" opacity="0.5"/>
    </g>

    <!-- Home button / notch -->
    <circle cx="130" cy="268" r="8" fill="none" stroke="#333" stroke-width="2"/>
  </g>

  <!-- Multi-account indicator: stacked circles -->
  <g filter="glow-filter">
    <!-- Account dot 1 -->
    <circle cx="380" cy="120" r="22" fill="#7c3aed" stroke="#0a0a0a" stroke-width="4"/>
    <text x="380" y="126" text-anchor="middle" font-family="monospace" font-weight="900" font-size="16" fill="#fff">1</text>

    <!-- Account dot 2 -->
    <circle cx="406" cy="168" r="22" fill="#3b82f6" stroke="#0a0a0a" stroke-width="4"/>
    <text x="406" y="174" text-anchor="middle" font-family="monospace" font-weight="900" font-size="16" fill="#fff">2</text>

    <!-- Account dot 3 -->
    <circle cx="392" cy="218" r="22" fill="#22c55e" stroke="#0a0a0a" stroke-width="4"/>
    <text x="392" y="224" text-anchor="middle" font-family="monospace" font-weight="900" font-size="16" fill="#fff">3</text>

    <!-- Plus dot -->
    <circle cx="370" cy="264" r="18" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="4,3"/>
    <text x="370" y="270" text-anchor="middle" font-family="monospace" font-weight="400" font-size="18" fill="#555">+</text>
  </g>

  <!-- Connection lines between dots -->
  <line x1="380" y1="142" x2="406" y2="146" stroke="#a855f7" stroke-width="1" opacity="0.3"/>
  <line x1="406" y1="190" x2="392" y2="196" stroke="#3b82f6" stroke-width="1" opacity="0.3"/>
  <line x1="392" y1="240" x2="370" y2="246" stroke="#22c55e" stroke-width="1" opacity="0.3"/>

  <!-- Bottom text -->
  <text x="256" y="450" text-anchor="middle" font-family="monospace" font-weight="900" font-size="32" fill="url(#glow)" letter-spacing="6">MULTI WA</text>
  <text x="256" y="472" text-anchor="middle" font-family="monospace" font-weight="400" font-size="12" fill="#555" letter-spacing="4">MULTI ACCOUNT</text>
</svg>
