<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Background hexagon -->
  <path d="M256 16L460 144v224L256 496 52 368V144L256 16z" fill="#0a0a0a" stroke="#a855f7" stroke-width="8"/>

  <!-- Inner hexagon glow -->
  <path d="M256 48L432 160v192L256 464 80 352V160L256 48z" fill="#0a0a0a" stroke="#a855f7" stroke-width="2" opacity="0.3"/>

  <!-- Chat bubble 1 (left) -->
  <g transform="translate(120, 150)">
    <path d="M0 24C0 10.7 10.7 0 24 0h88c13.3 0 24 10.7 24 24v56c0 13.3-10.7 24-24 24H40l-24 24V104H24C10.7 104 0 93.3 0 80V24z" fill="#a855f7"/>
    <!-- Signal bars inside bubble -->
    <rect x="28" y="44" width="8" height="28" rx="2" fill="#fff" opacity="0.9"/>
    <rect x="44" y="34" width="8" height="38" rx="2" fill="#fff" opacity="0.9"/>
    <rect x="60" y="24" width="8" height="48" rx="2" fill="#fff" opacity="0.9"/>
    <rect x="76" y="14" width="8" height="58" rx="2" fill="#fff" opacity="0.9"/>
    <rect x="92" y="24" width="8" height="48" rx="2" fill="#fff" opacity="0.9"/>
  </g>

  <!-- Chat bubble 2 (right, overlapping) -->
  <g transform="translate(220, 210)">
    <path d="M136 24C136 10.7 125.3 0 112 0H24C10.7 0 0 10.7 0 24v56c0 13.3 10.7 24 24 24h72l24 24V104h-8c13.3 0 24-10.7 24-24V24z" fill="#3b82f6"/>
    <!-- Signal bars inside bubble -->
    <rect x="28" y="44" width="8" height="28" rx="2" fill="#fff" opacity="0.9"/>
    <rect x="44" y="34" width="8" height="38" rx="2" fill="#fff" opacity="0.9"/>
    <rect x="60" y="24" width="8" height="48" rx="2" fill="#fff" opacity="0.9"/>
    <rect x="76" y="34" width="8" height="38" rx="2" fill="#fff" opacity="0.9"/>
    <rect x="92" y="44" width="8" height="28" rx="2" fill="#fff" opacity="0.9"/>
  </g>

  <!-- Connection line between bubbles -->
  <line x1="256" y1="278" x2="256" y2="310" stroke="#22c55e" stroke-width="4" stroke-dasharray="4,4"/>

  <!-- Infinity / multi symbol at bottom -->
  <g transform="translate(196, 340)">
    <path d="M60 0C40 0 24 16 24 36S40 72 60 72c12 0 22-6 30-16 8 10 18 16 30 16 20 0 36-16 36-36S140 0 120 0c-12 0-22 6-30 16C82 6 72 0 60 0z"
          fill="none" stroke="#22c55e" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- "MW" text -->
  <text x="256" y="435" text-anchor="middle" font-family="monospace" font-weight="900" font-size="42" fill="#e0e0e0" letter-spacing="8">MW</text>
</svg>
